services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dta}
      POSTGRES_USER: ${POSTGRES_USER:-dta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dta-local-demo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    pull_policy: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-dta}
      DB_USERNAME: ${POSTGRES_USER:-dta}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dta-local-demo}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
