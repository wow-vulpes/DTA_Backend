services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dta}
      POSTGRES_USER: ${POSTGRES_USER:-dta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/dta}
      DB_USERNAME: ${DB_USERNAME:-dta}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "8080:8080"

volumes:
  postgres-data:
