name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: ./mvnw -B -ntp verify
      - name: Start Compose without an env file
        run: docker compose up -d
      - name: Check HTTP readiness and persistence after restart
        shell: bash
        run: |
          curl --fail --retry 40 --retry-all-errors --retry-delay 3 http://localhost:8080/api/checks
          printf 'Metadata-only smoke test\n' > /tmp/observation-diary.pdf
          curl --fail -sS http://localhost:8080/api/checks \
            -F record_type=daily -F files=@/tmp/observation-diary.pdf > /tmp/check.json
          CHECK_ID=$(python3 -c 'import json; print(json.load(open("/tmp/check.json"))["check_id"])')
          docker compose restart db
          docker compose up -d --wait db
          docker compose restart app
          curl --fail --retry 40 --retry-all-errors --retry-delay 3 \
            "http://localhost:8080/api/checks/$CHECK_ID" > /tmp/restored.json
          python3 - <<'PY'
          import json
          with open('/tmp/check.json') as source, open('/tmp/restored.json') as restored:
              original, actual = json.load(source), json.load(restored)
          differences = {key: {'before': original.get(key), 'after': actual.get(key)}
                         for key in original.keys() | actual.keys()
                         if original.get(key) != actual.get(key)}
          assert original == actual, f'Result changed after restart: {differences}'
          assert actual['status'] == 'incomplete'
          assert len(actual['documents']) == 1
          PY
      - name: Compose logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop Compose
        if: always()
        run: docker compose down
